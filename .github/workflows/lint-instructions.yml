name: Lint agent instructions

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-instructions:
    name: lintamigo dogfood
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lintamigo
        run: pnpm build

      - name: Lint repository instructions
        run: node dist/cli.mjs --format github
